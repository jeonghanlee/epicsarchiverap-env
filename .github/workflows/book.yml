name: Appliance book

on:
  push:
    branches: [maven]
    paths:
      - 'book/**'
      - 'configure/**'
      - 'scripts/**'
      - 'site-template/**'
      - 'Makefile'
      - '.github/workflows/book.yml'
  pull_request:
    branches: [maven]
    paths:
      - 'book/**'
      - 'configure/**'
      - 'scripts/**'
      - 'site-template/**'
      - 'Makefile'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: '0.5.4'
  MDBOOK_SHA256: '3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7'

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch the selected source
        run: make init
      - name: Check generated pages
        run: bash book/scripts/check-generated.bash

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v6
      - name: Install mdBook
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/mdbook"
          archive="${install_dir}/mdbook.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MDBOOK_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$install_dir" mdbook
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Build book
        run: mdbook build book
      - name: Verify entry page
        run: test -s book/site/index.html
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/maven'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/maven'
        uses: actions/upload-pages-artifact@v4
        with:
          path: book/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/maven'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
